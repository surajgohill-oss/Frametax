name: la-concert-watchlist

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: concert
      POSTGRES_DB: concert_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concert -d concert_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://concert:concert@db:5432/concert_tracker
      DATABASE_SYNC_URL: postgresql://concert:concert@db:5432/concert_tracker
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
      APP_NAME: LA Concert Watchlist Tracker
      MAX_TRACKED_EVENTS: "30"
      DEFAULT_POLL_INTERVAL_MINUTES: "60"
      BROWSER_DATA_DIR: /app/browser_sessions
      CORS_ORIGINS: '["http://localhost:3000"]'
      SEATGEEK_CLIENT_ID: ${SEATGEEK_CLIENT_ID:-}
      SEATGEEK_CLIENT_SECRET: ${SEATGEEK_CLIENT_SECRET:-}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
    volumes:
      - ./backend:/app
      - browser_sessions:/app/browser_sessions
      - ./shared:/shared:ro
      - ./scripts:/shared_scripts:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    command: >
      sh -c "
        alembic upgrade head &&
        python /shared_scripts/seed_db_docker.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
  browser_sessions:
