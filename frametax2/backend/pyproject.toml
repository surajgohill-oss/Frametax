[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "frametax2-backend"
version = "0.1.0"
description = "FrameTax 2.0 — Global Production Structure Optimization Engine"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.1.0",
    # Validation / serialization
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # File processing
    "pypdf>=4.3.0",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    # Task queue
    "rq>=1.16.0",
    "redis>=5.1.0",
    # HTTP client
    "httpx>=0.27.0",
    # Cross-Model Bridge — native provider SDKs (see app/bridge/adapters/)
    "anthropic>=0.120.0",
    "openai>=2.48.0",
    "google-genai>=2.14.0",
    "click>=8.1.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "babel>=2.16.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
